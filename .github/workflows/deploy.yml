name: Deploy Public Folder to Pages

on:
  push:
    branches: ["main"]

# Mengatur izin token GITHUB_TOKEN untuk melakukan deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Menghindari bentrokan deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact from Public Folder
        uses: actions/upload-pages-artifact@v3
        with:
          # Perintah krusial: mengarahkan target hanya ke folder public Anda
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
