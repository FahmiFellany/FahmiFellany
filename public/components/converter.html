<!-- VIEW 1: DATETIME CONVERTER & ENTITY CRUD -->
<div id="viewConverter" class="view-container">
  <!-- Main Grid -->
  <main class="converter-grid">
    <!-- Left Column: Input & Options -->
    <section class="card input-card">
      <div class="card-header">
        <h2>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
          Teks Masukan (Input)
        </h2>
        <div class="input-header-actions">
          <input type="file" id="converterFileInput" accept=".txt,.php,.log,.csv,text/*" style="display: none;">
          <button type="button" id="btnUploadLogFile" class="btn-chip btn-chip-primary"
            title="Unggah file log (.txt / .php / .log)">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span>Unggah File (.txt / .php)</span>
          </button>
        </div>
      </div>

      <div class="form-group input-dropzone-group" id="converterDropzone">
        <textarea id="inputText" rows="10" spellcheck="false"
          placeholder="Masukkan teks log atau seret & lepas (Drag & Drop) file .txt / .php ke sini..."></textarea>
        <div class="drop-overlay" id="converterDropOverlay">
          <div class="drop-overlay-content">
            <div class="drop-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="12" y2="12"></line>
                <line x1="15" y1="15" x2="12" y2="12"></line>
              </svg>
            </div>
            <p class="drop-text">Lepaskan file <strong>.txt / .php / .log</strong> untuk memuat teks otomatis</p>
          </div>
        </div>
      </div>

      <!-- Options Bar -->
      <div class="options-panel">
        <div class="option-item">
          <label for="timezoneOffset">Penyesuaian Jam:</label>
          <select id="timezoneOffset" class="custom-select">
            <option value="1s" selected>+1 Detik</option>
          </select>
        </div>
        <div class="option-item" style="margin-left: auto;">
          <label class="checkbox-label"
            style="display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem; color: #cbd5e1; user-select: none;">
            <input type="checkbox" id="autoCleanDuplicates" checked
              style="accent-color: #3b82f6; cursor: pointer; width: 15px; height: 15px;">
            Otomatis bersihkan chat duplikat
          </label>
        </div>
      </div>

      <!-- Variable Shortcuts Bar -->
      <div class="variables-panel">
        <div class="variables-header">
          <span class="variables-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V4h16v3" />
              <path d="M9 20h6" />
              <path d="M12 4v16" />
            </svg>
            Kode Shortcut :
          </span>
          <div class="variables-header-actions">
            <span class="variables-hint">Ketik nama variabel di input atau klik tombol</span>
            <button type="button" id="btnOpenVarModal" class="btn-manage-vars">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
              </svg>
              Kelola Shortcut
            </button>
          </div>
        </div>
        <div class="variables-chips" id="variablesChipsContainer">
          <button type="button" class="var-chip" data-var="idm" title="idm = Informasi dari Mitra">
            <span class="chip-code">idm</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">Informasi dari Mitra</span>
          </button>
          <button type="button" class="var-chip" data-var="idi" title="idi = Informasi dari Internal">
            <span class="chip-code">idi</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">Informasi dari Internal</span>
          </button>
          <button type="button" class="var-chip" data-var="idb" title="idb = Informasi dari Biller">
            <span class="chip-code">idb</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">Informasi dari Biller</span>
          </button>
          <button type="button" class="var-chip" data-var="fvo" title="fvo = FU ke VSI OPS">
            <span class="chip-code">fvo</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">FU ke VSI OPS</span>
          </button>
          <button type="button" class="var-chip" data-var="fms" title="fms = FU ke MASA SAC">
            <span class="chip-code">fms</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">FU ke MASA SAC</span>
          </button>
          <button type="button" class="var-chip" data-var="fc" title="fc = FU ke Ceria">
            <span class="chip-code">fc</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">FU ke Ceria</span>
          </button>
          <button type="button" class="var-chip" data-var="fb" title="fb = Fu ke Biller">
            <span class="chip-code">fb</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">Fu ke Biller</span>
          </button>
          <button type="button" class="var-chip" data-var="mkm" title="mkm = Menyampaikan ke mitra">
            <span class="chip-code">mkm</span>
            <span class="chip-arrow">→</span>
            <span class="chip-label">Menyampaikan ke mitra</span>
          </button>
        </div>
      </div>

      <div class="action-bar">
        <button type="button" id="btnConvert" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8" />
            <line x1="4" y1="20" x2="21" y2="3" />
            <polyline points="21 16 21 21 16 21" />
            <line x1="15" y1="15" x2="21" y2="21" />
            <line x1="4" y1="4" x2="9" y2="9" />
          </svg>
          Konversi Format
        </button>
        <button type="button" id="btnClear" class="btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          Bersihkan Form
        </button>
        <label class="auto-convert-toggle">
          <input type="checkbox" id="autoConvert" checked>
          <span>Konversi Otomatis saat mengetik / paste</span>
        </label>
      </div>
    </section>

    <!-- Right Column: Output -->
    <section class="card output-card">
      <div class="card-header">
        <h2>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          Hasil Konversi (Output)
        </h2>
        <div class="header-badges-group">
          <span class="match-count-badge" id="matchBadge">0 tanggal dikonversi</span>
        </div>
      </div>

      <!-- Smart Quick-Actions Context Suggestions -->
      <div id="smartSuggestionsPanel" class="smart-suggestions-panel" style="display: none;">
        <div class="suggestions-header">
          <span class="suggestions-icon">⚡</span>
          <span class="suggestions-title">Rekomendasi Template Helpdesk:</span>
        </div>
        <div class="suggestions-chips" id="smartSuggestionsChips"></div>
      </div>

      <div class="form-group">
        <textarea id="outputText" readonly placeholder="Hasil konversi akan tampil di sini..." rows="10"
          spellcheck="false"></textarea>
      </div>

      <div class="output-actions">
        <div class="output-actions-left">
          <button type="button" id="btnCopy" class="btn-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            Salin Hasil
          </button>
          <button type="button" id="btnCopyAndReset" class="btn-copy-reset"
            title="Salin teks ke clipboard & langsung bersihkan form untuk tiket berikutnya">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Salin & Bersihkan Form
          </button>
        </div>
        <div class="output-actions-right">
          <label class="auto-clear-toggle" title="Otomatis bersihkan form setelah menekan tombol Salin Hasil">
            <input type="checkbox" id="autoClearOnCopy">
            <span>Otomatis bersihkan form setelah salin</span>
          </label>
        </div>
      </div>
    </section>
  </main>
</div>
