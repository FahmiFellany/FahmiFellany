<!-- MODAL POPUP: Database & Manajemen Item Saldo Biller (CRUD) -->
<div id="saldoCrudModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="modal-icon" style="background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
            <path d="M6 15h2" />
            <path d="M12 15h6" />
          </svg>
        </div>
        <div>
          <h2>Saldo Biller</h2>
        </div>
      </div>
      <div class="modal-header-actions">
        <button type="button" id="btnResetSaldoDefaults" class="btn-ghost-sm" title="Kembalikan ke Item Bawaan">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
          Reset Default
        </button>
        <button type="button" id="btnCloseSaldoCrudModal" class="btn-close-modal" title="Tutup Modal (Esc)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="modal-body">
      <!-- Group Switcher inside Modal -->
      <div class="entity-tabs" style="margin-bottom: 1rem;">
        <button type="button" id="saldoModalGroupPagiMalam" class="entity-tab-btn">Mode Pagi & Malam (21
          Item)</button>
        <button type="button" id="saldoModalGroupSiangSore" class="entity-tab-btn active">Mode Siang & Sore (17
          Item)</button>
      </div>

      <div class="entity-grid">
        <!-- Form Input / Edit Item Saldo -->
        <form id="saldoCrudForm" class="entity-form">
          <input type="hidden" id="saldoCrudItemId">
          <div class="form-group-item">
            <label for="saldoCrudItemLabel">Label / Nama Item Saldo (Format Lengkap):*</label>
            <input type="text" id="saldoCrudItemLabel" placeholder="Contoh: Saldo PLN - JATEL :" required
              autocomplete="off">
          </div>
          <div class="form-group-item">
            <label for="saldoCrudItemDesc">Keterangan / Catatan Biller (Opsional):</label>
            <input type="text" id="saldoCrudItemDesc" placeholder="Contoh: PLN Jatel Biller">
          </div>
          <div class="form-actions">
            <button type="submit" id="btnSaveSaldoCrudItem" class="btn-primary">Tambah Item Saldo</button>
            <button type="button" id="btnCancelSaldoCrudEdit" class="btn-secondary" style="display: none;">Batal
              Edit</button>
          </div>
        </form>

        <!-- Tabel Item Saldo & Filter Search -->
        <div class="entity-list-panel">
          <div class="var-table-toolbar">
            <div class="search-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="saldoCrudSearchInput" placeholder="Cari nama item saldo...">
            </div>
          </div>

          <div class="table-responsive">
            <table class="entity-table">
              <thead>
                <tr>
                  <th style="width: 65px; text-align: center;">Urutan</th>
                  <th style="width: 45%;">Label / Nama Saldo</th>
                  <th style="width: 25%;">Keterangan</th>
                  <th style="width: 90px; text-align: center;">Aksi</th>
                </tr>
              </thead>
              <tbody id="saldoCrudTableBody">
                <!-- Diisi via JS -->
              </tbody>
            </table>
            <div id="saldoCrudEmptyMsg" class="empty-msg" style="display: none;">Belum ada item saldo yang cocok.
            </div>
          </div>

          <!-- Footer Controls -->
          <div class="entity-footer">
            <span class="entries-info" id="saldoCrudEntriesInfo">Menampilkan 0 item saldo</span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" id="btnFooterCloseSaldoCrudModal" class="btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        Tutup
      </button>
    </div>
  </div>
</div>
