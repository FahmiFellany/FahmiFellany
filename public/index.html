<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converter HD - DateTime & Operations Helper Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js Client-Side OCR CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- SheetJS CDN for Excel (.xlsx) export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div class="app-container">
    <!-- Header Utama Navigasi -->
    <header
      class="app-header flex items-center justify-between bg-slate-900/90 backdrop-blur-md border border-slate-800/80 px-4 py-2.5 rounded-2xl shadow-2xl shadow-slate-950/80">
      <div class="header-left flex items-center gap-6">
        <!-- Logo -->
        <div class="logo-group flex items-center gap-3 select-none">
          <div
            class="logo-icon w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 via-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-cyan-500/30 flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <polyline points="9 11 12 14 22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <h1 class="text-base font-bold text-white tracking-tight m-0">Converter HD</h1>
        </div>

        <!-- Navbar Navigasi -->
        <nav class="app-navbar flex items-center bg-slate-950/70 border border-slate-800/60 p-1 rounded-xl gap-1">
          <button type="button" id="navTabConverter"
            class="nav-tab active flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>DateTime Converter</span>
          </button>
          <button type="button" id="navTabOcr"
            class="nav-tab flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span>Pengecekan Transaksi</span>
          </button>
          <button type="button" id="navTabSaldo"
            class="nav-tab flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <line x1="2" y1="10" x2="22" y2="10" />
              <path d="M6 15h2" />
              <path d="M12 15h6" />
            </svg>
            <span>Update Info Saldo</span>
          </button>
          <button type="button" id="navTabCidEks"
            class="nav-tab flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>CID EKS</span>
          </button>
          <button type="button" id="navTabMbsb"
            class="nav-tab flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
            <span>MBSB</span>
          </button>
        </nav>
      </div>

      <!-- Status Badge -->
      <div
        class="status-badge flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium select-none">
        <span class="status-dot relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span>Localhost Active</span>
      </div>
    </header>

    <!-- MOUNT POINTS FOR MODULAR HTML COMPONENTS -->
    <div id="viewConverterContainer"></div>
    <div id="viewOcrContainer"></div>
    <div id="viewSaldoContainer"></div>
    <div id="viewCidEksContainer"></div>
    <div id="viewMbsbContainer"></div>

    <!-- Toast Notification Global -->
    <div id="toast" class="toast">Pesan tersalin ke clipboard!</div>

    <!-- Modal Zoom Fullscreen Pratinjau Gambar HD -->
    <div id="ocrZoomModal" class="ocr-zoom-modal" style="display: none;">
      <div class="zoom-modal-backdrop" id="ocrZoomBackdrop"></div>
      <div class="zoom-modal-dialog">
        <div class="zoom-modal-header">
          <h3>🔍 Detail Pratinjau Gambar Transaksi (HD Zoom)</h3>
          <div class="zoom-modal-controls">
            <button type="button" id="ocrBtnZoomIn" class="btn-chip btn-chip-primary">Zoom In (+)</button>
            <button type="button" id="ocrBtnZoomOut" class="btn-chip">Zoom Out (-)</button>
            <button type="button" id="ocrBtnZoomReset" class="btn-chip">100%</button>
            <button type="button" id="ocrBtnCloseZoom" class="btn-chip btn-chip-danger">Tutup (✕)</button>
          </div>
        </div>
        <div class="zoom-modal-body" id="ocrZoomBody">
          <img id="ocrZoomImg" src="" alt="Detail Gambar Transaksi HD">
        </div>
      </div>
    </div>

    <!-- MOUNT POINTS FOR MODAL POPUPS -->
    <div id="variableCrudModalContainer"></div>
    <div id="saldoCrudModalContainer"></div>

  </div> <!-- /app-container -->

  <!-- Application Bootstrap Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
